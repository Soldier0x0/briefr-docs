<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
        <title id="archify-diagram-title">Search and embeddings</title>
        <desc id="archify-diagram-description">Keyword FTS plus optional pgvector hybrid merge</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Query</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / API</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Indexes</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="3" x="661" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Hits</text>

        <!-- Flow paths -->
        <path data-edge-from="q" data-edge-to="api" data-edge-label="search" data-edge-key="0" data-edge-id="q-a" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="api" data-edge-to="idx" data-edge-label="keyword + kNN" data-edge-key="1" data-edge-id="a-i" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="idx" data-edge-to="hits" data-edge-label="ranked" data-edge-key="2" data-edge-id="i-h" data-composition-points="586,271;689,271" d="M 586 271 L 689 271" class="a-emphasis" data-animate="edge" style="--step:2" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <g id="node-q" data-node-id="q" data-node-label="Query" tabindex="0" role="button" aria-label="Focus Query, q=, 01 / Query" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="q=" data-node-tag="analyst" data-node-context="01 / Query">
          <title>Query · q= · 01 / Query · analyst</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(50 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Query</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">q=</text>
        <text data-detail="fine" x="100" y="289" class="t-frontend" font-size="7" text-anchor="middle">analyst</text>
        </g>

        <g id="node-api" data-node-id="api" data-node-label="Search API" tabindex="0" role="button" aria-label="Focus Search API, hybrid RRF, 02 / API" aria-pressed="false" data-node-kind="backend" data-node-sublabel="hybrid RRF" data-node-tag="request" data-node-context="02 / API">
          <title>Search API · hybrid RRF · 02 / API · request</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(265 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Search API</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">hybrid RRF</text>
        <text data-detail="fine" x="315" y="289" class="t-backend" font-size="7" text-anchor="middle">request</text>
        </g>

        <g id="node-idx" data-node-id="idx" data-node-label="FTS + vector" tabindex="0" role="button" aria-label="Focus FTS + vector, PostgreSQL, 03 / Indexes" aria-pressed="false" data-node-kind="database" data-node-sublabel="PostgreSQL" data-node-tag="optional kNN" data-node-context="03 / Indexes">
          <title>FTS + vector · PostgreSQL · 03 / Indexes · optional kNN</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-database" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(480 248) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">FTS + vector</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">PostgreSQL</text>
        <text data-detail="fine" x="530" y="289" class="t-database" font-size="7" text-anchor="middle">optional kNN</text>
        </g>

        <g id="node-hits" data-node-id="hits" data-node-label="Ranked hits" tabindex="0" role="button" aria-label="Focus Ranked hits, FEED, 04 / Hits" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="FEED" data-node-tag="merge" data-node-context="04 / Hits">
          <title>Ranked hits · FEED · 04 / Hits · merge</title>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(695 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="745" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Ranked hits</text>
          <text data-detail="context" x="745" y="279" class="t-muted" font-size="7" text-anchor="middle">FEED</text>
        <text data-detail="fine" x="745" y="289" class="t-frontend" font-size="7" text-anchor="middle">merge</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="q" data-edge-to="api" data-edge-label="search" data-edge-key="0" data-edge-id="q-a">
          <rect x="184.35" y="250" width="46.3" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-backend" font-size="8" text-anchor="middle">search</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">request</text>
        </g>
        <g data-detail="context" data-edge-from="api" data-edge-to="idx" data-edge-label="keyword + kNN" data-edge-key="1" data-edge-id="a-i">
          <rect x="384.65" y="250" width="75.7" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">keyword + kNN</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">local</text>
        </g>
        <g data-detail="context" data-edge-from="idx" data-edge-to="hits" data-edge-label="ranked" data-edge-key="2" data-edge-id="i-h">
          <rect x="616.8" y="250" width="41.4" height="27" rx="4" class="c-mask"/>
          <text x="637.5" y="261" class="t-backend" font-size="8" text-anchor="middle">ranked</text>
        <text data-detail="fine" x="637.5" y="272" class="t-dim" font-size="7" text-anchor="middle">read</text>
        </g>

        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
            <path d="M 40 441 L 74 441" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="444" class="t-muted" font-size="10" font-weight="500">primary data</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="data store" data-legend-x="165" data-legend-baseline="444" data-legend-width="93">
            <rect x="165" y="436" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
            <text x="187" y="444" class="t-muted" font-size="10" font-weight="500">data store</text>
          </g>
        </g>
      </svg>
