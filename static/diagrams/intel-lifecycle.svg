          <text x="852.5" y="261" class="t-backend" font-size="8" text-anchor="middle">explainable links</text>
        <text data-detail="fine" x="852.5" y="272" class="t-dim" font-size="7" text-anchor="middle">read path</text>
        </g>

        <!-- Legend -->
        <g data-legend="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
