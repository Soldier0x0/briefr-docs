        <path data-edge-from="normalize" data-edge-to="enrich" data-edge-label="CVE records" data-edge-key="1" data-edge-id="n-e" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
