        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">ingest</text>
        </g>
        <g data-detail="context" data-edge-from="normalize" data-edge-to="enrich" data-edge-label="CVE records" data-edge-key="1" data-edge-id="n-e">
