<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
        <title id="archify-diagram-title">Detect workflow</title>
        <desc id="archify-diagram-description">Coverage gaps become Sigma starters and hunt packs</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Map</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Gap</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Generate</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="3" x="661" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Pack</text>

        <!-- Flow paths -->
        <path data-edge-from="map" data-edge-to="gap" data-edge-label="uncovered" data-edge-key="0" data-edge-id="m-g" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="gap" data-edge-to="gen" data-edge-label="generate" data-edge-key="1" data-edge-id="g-n" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="gen" data-edge-to="pack" data-edge-label="save" data-edge-key="2" data-edge-id="n-p" data-composition-points="586,271;689,271" d="M 586 271 L 689 271" class="a-emphasis" data-animate="edge" style="--step:2" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <g id="node-map" data-node-id="map" data-node-label="ATT&amp;CK map" tabindex="0" role="button" aria-label="Focus ATT&amp;CK map, local STIX, 01 / Map" aria-pressed="false" data-node-kind="database" data-node-sublabel="local STIX" data-node-tag="weekly" data-node-context="01 / Map">
          <title>ATT&amp;CK map · local STIX · 01 / Map · weekly</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-database" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(50 248) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">ATT&amp;CK map</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">local STIX</text>
        <text data-detail="fine" x="100" y="289" class="t-database" font-size="7" text-anchor="middle">weekly</text>
        </g>

        <g id="node-gap" data-node-id="gap" data-node-label="Coverage gap" tabindex="0" role="button" aria-label="Focus Coverage gap, Forge, 02 / Gap" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="Forge" data-node-tag="KEV" data-node-context="02 / Gap">
          <title>Coverage gap · Forge · 02 / Gap · KEV</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(265 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Coverage gap</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">Forge</text>
        <text data-detail="fine" x="315" y="289" class="t-frontend" font-size="7" text-anchor="middle">KEV</text>
        </g>

        <g id="node-gen" data-node-id="gen" data-node-label="Generate" tabindex="0" role="button" aria-label="Focus Generate, Sigma / query, 03 / Generate" aria-pressed="false" data-node-kind="backend" data-node-sublabel="Sigma / query" data-node-tag="starter" data-node-context="03 / Generate">
          <title>Generate · Sigma / query · 03 / Generate · starter</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(480 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Generate</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">Sigma / query</text>
        <text data-detail="fine" x="530" y="289" class="t-backend" font-size="7" text-anchor="middle">starter</text>
        </g>

        <g id="node-pack" data-node-id="pack" data-node-label="Hunt pack" tabindex="0" role="button" aria-label="Focus Hunt pack, saved, 04 / Pack" aria-pressed="false" data-node-kind="database" data-node-sublabel="saved" data-node-tag="not SIEM" data-node-context="04 / Pack">
          <title>Hunt pack · saved · 04 / Pack · not SIEM</title>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-database" data-animate="node" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(695 248) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="745" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Hunt pack</text>
          <text data-detail="context" x="745" y="279" class="t-muted" font-size="7" text-anchor="middle">saved</text>
        <text data-detail="fine" x="745" y="289" class="t-database" font-size="7" text-anchor="middle">not SIEM</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="map" data-edge-to="gap" data-edge-label="uncovered" data-edge-key="0" data-edge-id="m-g">
          <rect x="179.45" y="250" width="56.1" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-backend" font-size="8" text-anchor="middle">uncovered</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">read</text>
        </g>
        <g data-detail="context" data-edge-from="gap" data-edge-to="gen" data-edge-label="generate" data-edge-key="1" data-edge-id="g-n">
          <rect x="396.9" y="250" width="51.2" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">generate</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">request</text>
        </g>
        <g data-detail="context" data-edge-from="gen" data-edge-to="pack" data-edge-label="save" data-edge-key="2" data-edge-id="n-p">
          <rect x="619.25" y="250" width="36.5" height="27" rx="4" class="c-mask"/>
          <text x="637.5" y="261" class="t-backend" font-size="8" text-anchor="middle">save</text>
        <text data-detail="fine" x="637.5" y="272" class="t-dim" font-size="7" text-anchor="middle">local</text>
        </g>

        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
            <path d="M 40 441 L 74 441" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="444" class="t-muted" font-size="10" font-weight="500">primary data</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="data store" data-legend-x="165" data-legend-baseline="444" data-legend-width="93">
            <rect x="165" y="436" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
            <text x="187" y="444" class="t-muted" font-size="10" font-weight="500">data store</text>
          </g>
        </g>
      </svg>
