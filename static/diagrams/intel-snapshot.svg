<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
        <title id="archify-diagram-title">Intel snapshot publish</title>
        <desc id="archify-diagram-description">Export intel schema only — operator tables stay on the box</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Intel</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Export</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Bundle</text>

        <!-- Flow paths -->
        <path data-edge-from="intel" data-edge-to="export" data-edge-label="dump intel" data-edge-key="0" data-edge-id="i-e" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="export" data-edge-to="bundle" data-edge-label="gzip + manifest" data-edge-key="1" data-edge-id="e-b" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <g id="node-intel" data-node-id="intel" data-node-label="intel schema" tabindex="0" role="button" aria-label="Focus intel schema, CVE + maps, 01 / Intel" aria-pressed="false" data-node-kind="database" data-node-sublabel="CVE + maps" data-node-tag="publishable" data-node-context="01 / Intel">
          <title>intel schema · CVE + maps · 01 / Intel · publishable</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-database" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(50 248) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">intel schema</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">CVE + maps</text>
        <text data-detail="fine" x="100" y="289" class="t-database" font-size="7" text-anchor="middle">publishable</text>
        </g>

        <g id="node-export" data-node-id="export" data-node-label="Export script" tabindex="0" role="button" aria-label="Focus Export script, row guards, 02 / Export" aria-pressed="false" data-node-kind="backend" data-node-sublabel="row guards" data-node-tag="zero app" data-node-context="02 / Export">
          <title>Export script · row guards · 02 / Export · zero app</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(265 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Export script</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">row guards</text>
        <text data-detail="fine" x="315" y="289" class="t-backend" font-size="7" text-anchor="middle">zero app</text>
        </g>

        <g id="node-bundle" data-node-id="bundle" data-node-label="Public bundle" tabindex="0" role="button" aria-label="Focus Public bundle, pgdump.gz, 03 / Bundle" aria-pressed="false" data-node-kind="external" data-node-sublabel="pgdump.gz" data-node-tag="monthly" data-node-context="03 / Bundle">
          <title>Public bundle · pgdump.gz · 03 / Bundle · monthly</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-external" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" transform="translate(480 248) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Public bundle</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">pgdump.gz</text>
        <text data-detail="fine" x="530" y="289" class="t-external" font-size="7" text-anchor="middle">monthly</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="intel" data-edge-to="export" data-edge-label="dump intel" data-edge-key="0" data-edge-id="i-e">
          <rect x="177" y="250" width="61" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-backend" font-size="8" text-anchor="middle">dump intel</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">local</text>
        </g>
        <g data-detail="context" data-edge-from="export" data-edge-to="bundle" data-edge-label="gzip + manifest" data-edge-key="1" data-edge-id="e-b">
          <rect x="379.75" y="250" width="85.5" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">gzip + manifest</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">publish</text>
        </g>

        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
            <path d="M 40 441 L 74 441" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="444" class="t-muted" font-size="10" font-weight="500">primary data</text>
          </g>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="data store" data-legend-x="165" data-legend-baseline="444" data-legend-width="93">
            <rect x="165" y="436" width="14" height="9" rx="2" class="c-database" stroke-width="1"/>
            <text x="187" y="444" class="t-muted" font-size="10" font-weight="500">data store</text>
          </g>
        </g>
      </svg>
