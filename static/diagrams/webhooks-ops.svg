<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
        <title id="archify-diagram-title">Webhooks and notifications</title>
        <desc id="archify-diagram-description">Alert rules enqueue deliveries to operator channels</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Event</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Rules</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / Queue</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="3" x="661" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Channel</text>

        <!-- Flow paths -->
        <path data-edge-from="evt" data-edge-to="rules" data-edge-label="match" data-edge-key="0" data-edge-id="e-r" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="rules" data-edge-to="q" data-edge-label="enqueue" data-edge-key="1" data-edge-id="r-q" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="q" data-edge-to="ch" data-edge-label="POST JSON" data-edge-key="2" data-edge-id="q-c" data-composition-points="586,271;689,271" d="M 586 271 L 689 271" class="a-emphasis" data-animate="edge" style="--step:2" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>

        <!-- Nodes -->
        <g id="node-evt" data-node-id="evt" data-node-label="Alert event" tabindex="0" role="button" aria-label="Focus Alert event, KEV / EPSS, 01 / Event" aria-pressed="false" data-node-kind="backend" data-node-sublabel="KEV / EPSS" data-node-tag="local" data-node-context="01 / Event">
          <title>Alert event · KEV / EPSS · 01 / Event · local</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(50 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Alert event</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">KEV / EPSS</text>
        <text data-detail="fine" x="100" y="289" class="t-backend" font-size="7" text-anchor="middle">local</text>
        </g>

        <g id="node-rules" data-node-id="rules" data-node-label="Rules engine" tabindex="0" role="button" aria-label="Focus Rules engine, match, 02 / Rules" aria-pressed="false" data-node-kind="backend" data-node-sublabel="match" data-node-tag="filter" data-node-context="02 / Rules">
          <title>Rules engine · match · 02 / Rules · filter</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(265 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Rules engine</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">match</text>
        <text data-detail="fine" x="315" y="289" class="t-backend" font-size="7" text-anchor="middle">filter</text>
        </g>

        <g id="node-q" data-node-id="q" data-node-label="Delivery" tabindex="0" role="button" aria-label="Focus Delivery, queue, 03 / Queue" aria-pressed="false" data-node-kind="messagebus" data-node-sublabel="queue" data-node-tag="retry" data-node-context="03 / Queue">
          <title>Delivery · queue · 03 / Queue · retry</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-messagebus" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="messagebus" class="semantic-sigil s-messagebus" transform="translate(480 248) scale(0.6875)">
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>
            <circle cx="5" cy="4.5" r="1" class="sigil-fill"/>
            <circle cx="10.5" cy="8" r="1" class="sigil-fill"/>
            <circle cx="7" cy="11.5" r="1" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Delivery</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">queue</text>
        <text data-detail="fine" x="530" y="289" class="t-messagebus" font-size="7" text-anchor="middle">retry</text>
        </g>

        <g id="node-ch" data-node-id="ch" data-node-label="Webhook" tabindex="0" role="button" aria-label="Focus Webhook, Slack HTTPS, 04 / Channel" aria-pressed="false" data-node-kind="external" data-node-sublabel="Slack HTTPS" data-node-tag="SSRF gated" data-node-context="04 / Channel">
          <title>Webhook · Slack HTTPS · 04 / Channel · SSRF gated</title>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-external" data-animate="node" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" transform="translate(695 248) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="745" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Webhook</text>
          <text data-detail="context" x="745" y="279" class="t-muted" font-size="7" text-anchor="middle">Slack HTTPS</text>
        <text data-detail="fine" x="745" y="289" class="t-external" font-size="7" text-anchor="middle">SSRF gated</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="evt" data-edge-to="rules" data-edge-label="match" data-edge-key="0" data-edge-id="e-r">
          <rect x="189.25" y="250" width="36.5" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-backend" font-size="8" text-anchor="middle">match</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">local</text>
        </g>
        <g data-detail="context" data-edge-from="rules" data-edge-to="q" data-edge-label="enqueue" data-edge-key="1" data-edge-id="r-q">
          <rect x="399.35" y="250" width="46.3" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">enqueue</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">ops</text>
        </g>
        <g data-detail="context" data-edge-from="q" data-edge-to="ch" data-edge-label="POST JSON" data-edge-key="2" data-edge-id="q-c">
          <rect x="609.45" y="250" width="56.1" height="27" rx="4" class="c-mask"/>
          <text x="637.5" y="261" class="t-backend" font-size="8" text-anchor="middle">POST JSON</text>
        <text data-detail="fine" x="637.5" y="272" class="t-dim" font-size="7" text-anchor="middle">outbound</text>
        </g>

        <!-- Legend -->
        <g data-legend="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
            <path d="M 40 441 L 74 441" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="444" class="t-muted" font-size="10" font-weight="500">primary data</text>
          </g>
        </g>
      </svg>
