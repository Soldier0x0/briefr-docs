        <path data-edge-from="edge" data-edge-to="api" data-edge-label="proxy" data-edge-key="1" data-edge-id="edge-api" data-composition-points="344,238;400,238" d="M 344 238 L 400 238" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
