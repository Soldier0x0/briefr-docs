<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 480" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
        <title id="archify-diagram-title">Hunt workflow</title>
        <desc id="archify-diagram-description">Pivot from a local CVE into IOC and Forge packs</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Data Stages -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="0" x="16" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="100" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">01 / Signal</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="1" x="231" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="315" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">02 / Drawer</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="2" x="446" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="530" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">03 / IOC</text>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="stage" data-composition-frame-id="3" x="661" y="46" width="168" height="360" rx="10" class="c-lane" stroke-width="1"/>
        <text x="745" y="68" class="t-dim" font-size="9" font-weight="600" text-anchor="middle">04 / Forge</text>

        <!-- Flow paths -->
        <path data-edge-from="cve" data-edge-to="draw" data-edge-label="open" data-edge-key="0" data-edge-id="c-d" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="draw" data-edge-to="ioc" data-edge-label="related IOC" data-edge-key="1" data-edge-id="d-i" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="ioc" data-edge-to="forge" data-edge-label="technique pack" data-edge-key="2" data-edge-id="i-f" data-composition-points="586,271;689,271" d="M 586 271 L 689 271" class="a-dashed" data-animate="edge" style="--step:2" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>

        <!-- Nodes -->
        <g id="node-cve" data-node-id="cve" data-node-label="CVE signal" tabindex="0" role="button" aria-label="Focus CVE signal, FEED card, 01 / Signal" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="FEED card" data-node-tag="local" data-node-context="01 / Signal">
          <title>CVE signal · FEED card · 01 / Signal · local</title>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="44" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(50 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="100" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">CVE signal</text>
          <text data-detail="context" x="100" y="279" class="t-muted" font-size="7" text-anchor="middle">FEED card</text>
        <text data-detail="fine" x="100" y="289" class="t-frontend" font-size="7" text-anchor="middle">local</text>
        </g>

        <g id="node-draw" data-node-id="draw" data-node-label="Investigation" tabindex="0" role="button" aria-label="Focus Investigation, session only, 02 / Drawer" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="session only" data-node-tag="pivot" data-node-context="02 / Drawer">
          <title>Investigation · session only · 02 / Drawer · pivot</title>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="259" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(265 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="315" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Investigation</text>
          <text data-detail="context" x="315" y="279" class="t-muted" font-size="7" text-anchor="middle">session only</text>
        <text data-detail="fine" x="315" y="289" class="t-frontend" font-size="7" text-anchor="middle">pivot</text>
        </g>

        <g id="node-ioc" data-node-id="ioc" data-node-label="IOC lookup" tabindex="0" role="button" aria-label="Focus IOC lookup, cached, 03 / IOC" aria-pressed="false" data-node-kind="backend" data-node-sublabel="cached" data-node-tag="optional" data-node-context="03 / IOC">
          <title>IOC lookup · cached · 03 / IOC · optional</title>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="474" y="242" width="112" height="58" rx="6" class="c-backend" data-animate="node" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(480 248) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="530" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">IOC lookup</text>
          <text data-detail="context" x="530" y="279" class="t-muted" font-size="7" text-anchor="middle">cached</text>
        <text data-detail="fine" x="530" y="289" class="t-backend" font-size="7" text-anchor="middle">optional</text>
        </g>

        <g id="node-forge" data-node-id="forge" data-node-label="Forge pack" tabindex="0" role="button" aria-label="Focus Forge pack, ATT&amp;CK gap, 04 / Forge" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="ATT&amp;CK gap" data-node-tag="queue" data-node-context="04 / Forge">
          <title>Forge pack · ATT&amp;CK gap · 04 / Forge · queue</title>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-mask"/>
          <rect x="689" y="242" width="112" height="58" rx="6" class="c-frontend" data-animate="node" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(695 248) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="745" y="263" class="t-primary" font-size="10" font-weight="600" text-anchor="middle">Forge pack</text>
          <text data-detail="context" x="745" y="279" class="t-muted" font-size="7" text-anchor="middle">ATT&amp;CK gap</text>
        <text data-detail="fine" x="745" y="289" class="t-frontend" font-size="7" text-anchor="middle">queue</text>
        </g>

        <!-- Flow labels -->
        <g data-detail="context" data-edge-from="cve" data-edge-to="draw" data-edge-label="open" data-edge-key="0" data-edge-id="c-d">
          <rect x="190.5" y="250" width="34" height="27" rx="4" class="c-mask"/>
          <text x="207.5" y="261" class="t-backend" font-size="8" text-anchor="middle">open</text>
        <text data-detail="fine" x="207.5" y="272" class="t-dim" font-size="7" text-anchor="middle">ui</text>
        </g>
        <g data-detail="context" data-edge-from="draw" data-edge-to="ioc" data-edge-label="related IOC" data-edge-key="1" data-edge-id="d-i">
          <rect x="389.55" y="250" width="65.9" height="27" rx="4" class="c-mask"/>
          <text x="422.5" y="261" class="t-backend" font-size="8" text-anchor="middle">related IOC</text>
        <text data-detail="fine" x="422.5" y="272" class="t-dim" font-size="7" text-anchor="middle">pivot</text>
        </g>
        <g data-detail="context" data-edge-from="ioc" data-edge-to="forge" data-edge-label="technique pack" data-edge-key="2" data-edge-id="i-f">
          <rect x="597.2" y="250" width="80.6" height="27" rx="4" class="c-mask"/>
          <text x="637.5" y="261" class="t-messagebus" font-size="8" text-anchor="middle">technique pack</text>
        <text data-detail="fine" x="637.5" y="272" class="t-dim" font-size="7" text-anchor="middle">pivot</text>
        </g>

        <!-- Legend -->
        <g data-legend="">
          <text x="40" y="424" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="444" data-legend-width="103">
            <path d="M 40 441 L 74 441" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="444" class="t-muted" font-size="10" font-weight="500">primary data</text>
          </g>
          <g data-legend-semantic-kind="dashed" data-legend-x="165" data-legend-baseline="444" data-legend-width="98">
            <path d="M 165 441 L 199 441" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
            <text x="208" y="444" class="t-muted" font-size="10" font-weight="500">async batch</text>
          </g>
        </g>
      </svg>
