<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 520" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-animation="trace" data-preset="signal-flow" data-quality-profile="showcase">
