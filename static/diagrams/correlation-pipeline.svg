        <path data-edge-from="cves" data-edge-to="engine" data-edge-label="CVE + IOC facts" data-edge-key="0" data-edge-id="cves-engine" data-composition-points="156,271;259,271" d="M 156 271 L 259 271" class="a-emphasis" data-animate="edge" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path data-edge-from="engine" data-edge-to="lanes" data-edge-label="score + reasons" data-edge-key="1" data-edge-id="engine-lanes" data-composition-points="371,271;474,271" d="M 371 271 L 474 271" class="a-emphasis" data-animate="edge" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
